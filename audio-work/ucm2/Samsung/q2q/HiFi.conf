Syntax 4

# Samsung Galaxy Z Fold 3 (q2q) -- two Cirrus CS35L41 amps on PRIMARY_MI2S_RX.
#   "Top"    amp @0x41, left I2S slot
#   "Bottom" amp @0x40, right I2S slot
#
# Three mutually exclusive outputs so a suspect speaker can simply not be
# selected: both, top only, bottom only. An unselected amp is digitally muted
# (Digital PCM Volume 0 = mute); it stays powered but drives nothing.
#
# NO SPEAKER PROTECTION: the Cirrus DSP firmware is not loaded, so nothing
# models coil temperature or excursion. The hardware level is therefore
# pinned low here and only software volume sits on top of it:
#   Analog PCM Volume  0    amp gain at its minimum (0.5 dB)
#   Digital PCM Volume 720  -12 dB  (0.125 dB per step, 816 = 0 dB, 913 = max)
# Raise 720 deliberately, a few dB at a time, or not at all.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Top Analog PCM Volume' 0"
		cset "name='Bottom Analog PCM Volume' 0"
		cset "name='Top Digital PCM Volume' 0"
		cset "name='Bottom Digital PCM Volume' 0"
	]

	DisableSequence [
		cset "name='Top Digital PCM Volume' 0"
		cset "name='Bottom Digital PCM Volume' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Both speakers"

	ConflictingDevice [
		"Speaker1"
		"Speaker2"
	]

	EnableSequence [
		cset "name='Top Digital PCM Volume' 720"
		cset "name='Bottom Digital PCM Volume' 720"
	]

	DisableSequence [
		cset "name='Top Digital PCM Volume' 0"
		cset "name='Bottom Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker1" {
	Comment "Top speaker only"

	ConflictingDevice [
		"Speaker"
		"Speaker2"
	]

	EnableSequence [
		cset "name='Top Digital PCM Volume' 720"
		cset "name='Bottom Digital PCM Volume' 0"
	]

	DisableSequence [
		cset "name='Top Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 90
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker2" {
	Comment "Bottom speaker only"

	ConflictingDevice [
		"Speaker"
		"Speaker1"
	]

	EnableSequence [
		cset "name='Top Digital PCM Volume' 0"
		cset "name='Bottom Digital PCM Volume' 720"
	]

	DisableSequence [
		cset "name='Bottom Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 80
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
