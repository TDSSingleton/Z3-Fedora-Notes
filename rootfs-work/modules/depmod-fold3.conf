# Install as /etc/depmod.d/fold3.conf on the phone.
#
# Needed before any PATCHED copy of a driver Fedora also builds can take
# effect (docs/18, section 2.2: qcom-camss, imx258, max17042_battery,
# max77705_charger, u_serial).
#
# kmod's built-in default search order is exactly:
#
#     search updates built-in
#
# -- "extra" is NOT in it (depmod.d(5): 'By default, depmod will give a higher
# priority to a directory with the name updates using this built-in search
# string: "updates built-in"'). Fedora ships no /etc/depmod.d file at all and
# there is no /usr/lib/depmod.d, so that default is what this rootfs has.
#
# Consequence: a module dropped into /lib/modules/<rel>/extra/ that ALSO
# exists under kernel/ loses, and modprobe silently loads Fedora's. Nothing
# warns; the driver just behaves like the unpatched one.
#
# This has never bitten us because every module in extra/ so far
# (ak09970-fold, fts9cu80f, panel-samsung-s6e3fab, s2mpb02-regulator) has no
# in-kernel counterpart. The moment we shadow a real driver it matters.
#
# After installing this file: depmod -a <release>, then check each shadowed
# module really resolves into extra/ --
#     modinfo -k <release> -F filename qcom-camss
search extra updates built-in
