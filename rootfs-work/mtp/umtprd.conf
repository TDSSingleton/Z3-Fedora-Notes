# uMTP-Responder config for the Fold 3.
# Install to /etc/umtprd/umtprd.conf.
#
# What the host sees as "storages" is just these paths. Unlike the mass-storage
# image this replaced, they are ordinary directories on the live filesystem --
# the phone keeps using them while the host browses them, because MTP is a
# file-level protocol, not a block-level one.

# Keep running when the cable is pulled, so the toggle survives a replug.
loop_on_disconnect 1

# Files the host creates should belong to the phone's user, not to root.
default_uid 1000
default_gid 1000
umask 022

# What the host can see. Start conservative: the user's home only.
# Add more lines to expose more; "ro" for read-only.
storage "/home/bunsenfold" "Internal storage" "rw"

# Examples, left commented:
#storage "/home/bunsenfold/Music"    "Music"     "rw"
#storage "/"                         "Root"      "ro"

# Identity shown to the host.
manufacturer "Samsung"
product "Galaxy Z Fold 3 (mainline)"
serial "fold3-q2q-0001"
